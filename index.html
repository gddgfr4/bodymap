<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>筋疲労マップ (Bodymap)</title>
    <style>
        /* 画面全体を固定し、スクロールを完全に禁止 */
        html, body {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f6f8;
            color: #333;
            box-sizing: border-box;
        }

        /* アプリ全体のコンテナ */
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%; height: 100%;
            padding: 12px;
            box-sizing: border-box;
        }

        /* ツールバー：スクロールなしですべて等幅に収める */
        .toolbar {
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            width: 100%;
            box-sizing: border-box;
            flex-shrink: 0;
            margin-bottom: 12px;
        }

        /* ボタンの行構成 */
        .button-row {
            display: flex;
            width: 100%;
            gap: 6px;
        }
        .button-row + .button-row {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #eee;
        }

        /* 各ボタンのベーススタイル */
        .btn {
            flex: 1; /* 行内で均等に引き伸ばす */
            text-align: center;
            padding: 10px 0;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.2s;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* 選択中の色・ツール */
        .tool-btn { background-color: #f3f4f6; color: #4b5563; }
        .tool-btn.active { border-color: #4a6ee0; box-shadow: 0 0 0 2px rgba(74, 110, 224, 0.2); color: inherit; }

        .color-1.active { background-color: #c7d2fe; color: #1e3a8a; }
        .color-2.active { background-color: #fdba74; color: #9a3412; }
        .color-3.active { background-color: #ef4444; color: #fff; }
        .color-eraser.active { background-color: #374151; color: #fff; }

        /* アクションボタン */
        .reset-btn { background-color: #fff; color: #6b7280; border: 1px solid #d1d5db; }
        .action-btn { background-color: #4a6ee0; color: white; }
        .action-btn:active { background-color: #3858c0; }

        /* マップ表示エリア：残りの画面スペースに自動フィット */
        .map-area {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .map-container {
            position: relative;
            background-color: #fdf6e9;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            overflow: hidden;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
        }

        .map-container canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain; /* 縦横比を崩さず枠内に収める */
            touch-action: none;  /* 独自のタッチ処理を行うためブラウザ標準を禁止 */
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="toolbar">
            <div class="button-row">
                <button class="btn tool-btn color-1 active" data-lvl="1">1 軽度</button>
                <button class="btn tool-btn color-2" data-lvl="2">2 中度</button>
                <button class="btn tool-btn color-3" data-lvl="3">3 重度</button>
                <button class="btn tool-btn color-eraser" id="btn-eraser">🧼 消去</button>
            </div>
            <div class="button-row">
                <button class="btn reset-btn" id="btn-reset">リセット</button>
                <button class="btn action-btn" id="btn-copy">共有/コピー</button>
                <button class="btn action-btn" id="btn-save">画像保存</button>
            </div>
        </div>

        <div class="map-area">
            <div class="map-container" id="mmWrap">
                <canvas id="mmBase"></canvas>
                <canvas id="mmBarrier" style="opacity: 0; pointer-events: none;"></canvas>
                <canvas id="mmOverlay"></canvas>
            </div>
        </div>
    </div>

    <script>
        const MM = {
            IMG_SRC: 'human.webp',
            LEVELS: { 1: [199,210,254,210], 2: [253,186,116,210], 3: [239,68,68,210] },
            TH_LINE: 130, DILATE: 2, FRAME: 3, TOL: 22,
            MAX_REGION_FRAC: 0.25, MIN_REGION_PX: 25
        };

        const mm = { base: null, overlay: null, barrier: null, bctx: null, octx: null, wctx: null, ready: false };
        let brush = { lvl: 1, erase: false };

        document.addEventListener('DOMContentLoaded', () => {
            mm.base = document.getElementById('mmBase');
            mm.overlay = document.getElementById('mmOverlay');
            mm.barrier = document.getElementById('mmBarrier');
            
            mm.bctx = mm.base.getContext('2d', { willReadFrequently: true });
            mm.octx = mm.overlay.getContext('2d', { willReadFrequently: true });
            mm.wctx = mm.barrier.getContext('2d', { willReadFrequently: true });

            const img = new Image();
            img.onload = () => {
                const w = img.naturalWidth;
                const h = img.naturalHeight;
                
                // アスペクト比をコンテナに設定
                document.getElementById('mmWrap').style.aspectRatio = `${w} / ${h}`;

                [mm.base, mm.overlay, mm.barrier].forEach(c => { 
                    c.width = w; c.height = h; 
                });

                mm.bctx.drawImage(img, 0, 0, w, h);
                makeBarrierFromBase(w, h);
                mm.ready = true;
                setupEvents();
            };
            img.onerror = () => alert('画像(human.webp)が読み込めません。同じフォルダに配置してください。');
            img.src = MM.IMG_SRC;
        });

        function tmpCtx(w, h) {
            if (!__tmpC) { __tmpC = document.createElement('canvas'); __tmpX = __tmpC.getContext('2d', { willReadFrequently: true }); }
            __tmpC.width = w; __tmpC.height = h;
            return __tmpX;
        }

        function makeBarrierFromBase(w, h) {
            const t = tmpCtx(w, h);
            t.clearRect(0, 0, w, h);
            t.drawImage(mm.base, 0, 0);

            const src = t.getImageData(0, 0, w, h).data;
            const out = mm.wctx.createImageData(w, h);
            const d = out.data;

            for (let i = 0; i < src.length; i += 4) {
                const g = 0.299 * src[i] + 0.587 * src[i+1] + 0.114 * src[i+2];
                d[i] = d[i+1] = d[i+2] = 0;
                d[i+3] = (g < MM.TH_LINE) ? 255 : 0;
            }

                for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {

                    for (let dy = -1; dy <= 1 && !on; dy++)
